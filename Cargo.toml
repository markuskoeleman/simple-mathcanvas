[package]
name = "mathcanvas"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.31.0-beta.4"
tiny-skia = "0.12"
softbuffer = "0.4"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.2", default-features = false, features = ["alloc"] }

[profile.dev]
opt-level = 3
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "dev"
debug = "line-tables-only"
strip = false
